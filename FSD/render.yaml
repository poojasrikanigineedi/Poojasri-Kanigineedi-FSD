services:
  - type: web
    name: mongodb-express-app-main
    runtime: node
    plan: free
    rootDir: FSD/mongodb-express-app-main
    buildCommand: rm -rf node_modules .env && npm install
    startCommand: node app.js
    envVars:
      - key: MONGO_URI
        sync: false

  - type: web
    name: mongoose-express-app
    runtime: node
    plan: free
    rootDir: FSD/mongoose-express-app
    buildCommand: rm -rf node_modules .env && npm install express mongoose dotenv cors
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false

  - type: web
    name: mvc-auth-app
    runtime: node
    plan: free
    rootDir: FSD/mvc-auth-app-main
    buildCommand: rm -rf node_modules .env && npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: temp-engine-ejs-app
    runtime: node
    plan: free
    rootDir: FSD/temp-engine-ejs-app
    buildCommand: rm -rf node_modules .env && npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false
