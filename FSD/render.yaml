services:
  - type: web
    name: mongodb-express-app
    runtime: node
    plan: free
    rootDir: FSD/mongodb-express-app-main # Remove "FSD/" if this folder is at the top level of your repo
    buildCommand: npm install
    startCommand: node app.js
    envVars:
      - key: MONGO_URI
        sync: false
- type: web
    name: mongoose-express-app
    runtime: node
    plan: free
    rootDir: FSD/mongoose-express-app # Remove "FSD/" if this folder is at the top level of your repo
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI # Match the exact variable name inside your .env file
        sync: false
 - type: web
    name: mvc-auth-app
    runtime: node
    plan: free
    rootDir: FSD/mvc-auth-app-main # Remove "FSD/" if this folder is at the top level of your repo
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
