services:
  - type: web
    name: mongodb-express-app-main
    runtime: node
    plan: free
    rootDir: FSD/mongodb-express-app-main
    buildCommand: rm -rf node_modules && npm install
    startCommand: node app.js
    envVars:
      - key: MONGO_URI
        value: YOUR_MONGODB_ATLAS_URI_HERE
      - key: MONGODB_URI
        value: YOUR_MONGODB_ATLAS_URI_HERE
      - key: DB_URL
        value: YOUR_MONGODB_ATLAS_URI_HERE

  - type: web
    name: mongoose-express-app
    runtime: node
    plan: free
    rootDir: FSD/mongoose-express-app
    buildCommand: rm -rf node_modules && npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        value: YOUR_MONGODB_ATLAS_URI_HERE
      - key: MONGODB_URI
        value: YOUR_MONGODB_ATLAS_URI_HERE
      - key: DB_URL
        value: YOUR_MONGODB_ATLAS_URI_HERE

  - type: web
    name: mvc-auth-app
    runtime: node
    plan: free
    rootDir: FSD/mvc-auth-app-main
    buildCommand: rm -rf node_modules && npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        value: YOUR_MONGODB_ATLAS_URI_HERE
      - key: MONGODB_URI
        value: YOUR_MONGODB_ATLAS_URI_HERE
      - key: JWT_SECRET
        value: fsd_super_secret_jwt_key_2026

  - type: web
    name: temp-engine-ejs-app
    runtime: node
    plan: free
    rootDir: FSD/temp-engine-ejs-app
    buildCommand: rm -rf node_modules && npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        value: YOUR_MONGODB_ATLAS_URI_HERE
      - key: MONGODB_URI
        value: YOUR_MONGODB_ATLAS_URI_HERE
      - key: DB_URL
        value: YOUR_MONGODB_ATLAS_URI_HERE
