services:
  - type: web
    name: mongodb-express-app-main
    runtime: node
    plan: free
    rootDir: FSD/mongodb-express-app-main
    buildCommand: npm install
    startCommand: node app.js
    envVars:
      - key: MONGO_URI
        sync: false

  - type: web
    name: mongoose-express-app
    runtime: node
    plan: free
    rootDir: FSD/mongoose-express-app
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false

  - type: web
    name: mvc-auth-app
    runtime: node
    plan: free
    rootDir: FSD/mvc-auth-app-main
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: mvc-express-app
    runtime: node
    plan: free
    rootDir: FSD/mvc-express-app-main
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false

  - type: web
    name: products-file-persistence-app
    runtime: node
    plan: free
    rootDir: FSD/products-file-persistence-app-main
    buildCommand: npm install
    startCommand: node server.js

  - type: web
    name: temp-engine-ejs-app
    runtime: node
    plan: free
    rootDir: FSD/temp-engine-ejs-app
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false

  - type: web
    name: mern-crud-backend
    runtime: node
    plan: free
    rootDir: FSD/mern-crud-app-main/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false
