services:
  # MERN CRUD app
  - type: web
    name: mern-crud-backend
    runtime: node
    plan: free
    rootDir: FSD/mern-crud-app-main/backend
    buildCommand: npm install
    startCommand: npm start

  - type: web
    name: mern-crud-frontend
    runtime: static
    rootDir: FSD/mern-crud-app-main/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Node & Express apps
  - type: web
    name: express-app
    runtime: node
    plan: free
    rootDir: FSD/express
    buildCommand: npm install
    startCommand: node app.js

  - type: web
    name: middleware-app
